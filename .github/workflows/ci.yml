name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The project has no runtime or build dependencies, so there is nothing
      # to install: every script runs on plain Node.
      - name: Static checks
        run: npm run check

      - name: Unit and integration tests
        run: npm test

      - name: Package the extension
        run: npm run build
